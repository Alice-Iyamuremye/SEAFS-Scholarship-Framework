name: SEAFS research validation

on:
  push:
    branches: [phd-portfolio-review]
  pull_request:
    branches: [main]

jobs:
  test-and-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run test suite
        run: pytest -q
      - name: Run deterministic model comparison
        run: python experiments/compare_10_vs_27_rule_models.py
      - name: Run disagreement diagnostics
        run: python experiments/diagnose_model_disagreements.py
      - name: Upload comparison outputs
        uses: actions/upload-artifact@v4
        with:
          name: seafs-model-comparison
          path: |
            reports/ten_vs_27_rule_grid_comparison.csv
            reports/ten_vs_27_rule_grid_summary.md
            reports/seafs_model_disagreement_diagnostics.csv
            reports/seafs_model_disagreement_summary.md
